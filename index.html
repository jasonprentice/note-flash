<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Note Flash</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      background: #111;
      color: #f5f5f5;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
    }

    .display {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: baseline;
      column-gap: 0.3em;
      width: 100%;
      font-size: min(27vw, 48vh);
      font-weight: 700;
      line-height: 1;
      font-family: Georgia, "Times New Roman", serif;
    }

    #string {
      font-family: "Times New Roman", Times, serif;
      font-variant-numeric: lining-nums tabular-nums;
      justify-self: end;
    }

    #note {
      min-height: 1em;
      white-space: nowrap;
    }

    #note .accidental {
      font-size: 0.6em;
      vertical-align: 0.5em;
    }

    .display select {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 1rem;
      font-weight: 400;
      margin-top: 1rem;
      padding: 0.4rem 0.6rem;
      border: 1px solid #444;
      border-radius: 0.5rem;
      background: #222;
      color: #f5f5f5;
      cursor: pointer;
    }

    #string-select {
      justify-self: end;
    }

    #note-select {
      justify-self: start;
    }
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      width: min(90vw, 480px);
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      width: 100%;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      width: 100%;
    }

    input[type="range"] {
      flex: 1;
      accent-color: #4fa3ff;
    }

    #rate-label {
      font-variant-numeric: tabular-nums;
    }

    button {
      font-size: 1rem;
      padding: 0.6rem 2rem;
      border: none;
      border-radius: 999px;
      background: #4fa3ff;
      color: #111;
      font-weight: 600;
      cursor: pointer;
    }

    .hint {
      color: #777;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="display">
    <div id="string">1</div>
    <div id="note">C</div>
    <select id="string-select" aria-label="String"></select>
    <select id="note-select" aria-label="Note"></select>
  </div>

  <div class="controls">
    <div class="slider-group">
      <div class="slider-row">
        <span>Slow</span>
        <input id="rate" type="range" min="0.2" max="3" step="0.1" value="1" />
        <span>Fast</span>
      </div>
      <span id="rate-label"></span>
    </div>
    <button id="toggle">Pause</button>
    <div class="hint">Press Space to pause / resume</div>
  </div>

  <script>
    const NOTES = [
      "C", "C#", "Db", "D", "D#", "Eb", "E", "F", "F#",
      "Gb", "G", "G#", "Ab", "A", "A#", "Bb", "B",
    ];

    const noteEl = document.getElementById("note");
    const stringEl = document.getElementById("string");
    const rateInput = document.getElementById("rate");
    const rateLabel = document.getElementById("rate-label");
    const toggleBtn = document.getElementById("toggle");
    const stringSelect = document.getElementById("string-select");
    const noteSelect = document.getElementById("note-select");

    const STRINGS = ["1", "2", "3", "4", "5", "6"];
    const SHUFFLE = "shuffle";
    const NOTE_POOLS = {
      [SHUFFLE]: NOTES,
      naturals: NOTES.filter((n) => n.length === 1),
    };

    let current = null;
    let currentString = null;
    let timer = null;
    let running = true;

    function prettyNote(note) {
      return note.replace("#", "♯").replace("b", "♭");
    }

    stringSelect.add(new Option("Shuffle", SHUFFLE));
    for (const s of STRINGS) stringSelect.add(new Option(`String ${s}`, s));

    noteSelect.add(new Option("Shuffle all", SHUFFLE));
    noteSelect.add(new Option("Shuffle naturals", "naturals"));
    for (const n of NOTES) noteSelect.add(new Option(prettyNote(n), n));

    function render(note) {
      const letter = note[0];
      const accidental = note[1] === "#" ? "♯" : note[1] === "b" ? "♭" : "";
      noteEl.innerHTML = accidental
        ? `${letter}<span class="accidental">${accidental}</span>`
        : letter;
    }

    function pickRandom(pool, previous) {
      let value;
      do {
        value = pool[Math.floor(Math.random() * pool.length)];
      } while (value === previous && pool.length > 1);
      return value;
    }

    function nextNote() {
      const notePool = NOTE_POOLS[noteSelect.value];
      const noteFixed = !notePool;

      if (noteFixed) {
        current = noteSelect.value;
      } else {
        current = pickRandom(notePool, current);
      }

      if (stringSelect.value !== SHUFFLE) {
        currentString = stringSelect.value;
      } else {
        // With a fixed note, avoid repeating the string so each tick visibly changes.
        currentString = pickRandom(STRINGS, noteFixed ? currentString : null);
      }

      render(current);
      stringEl.textContent = currentString;
    }

    function onSelectChange() {
      if (stringSelect.value !== SHUFFLE) {
        currentString = stringSelect.value;
        stringEl.textContent = currentString;
      }
      if (!NOTE_POOLS[noteSelect.value]) {
        current = noteSelect.value;
        render(current);
      }
    }

    stringSelect.addEventListener("change", onSelectChange);
    noteSelect.addEventListener("change", onSelectChange);

    function tick() {
      nextNote();
      timer = setTimeout(tick, 1000 / Number(rateInput.value));
    }

    function start() {
      running = true;
      toggleBtn.textContent = "Pause";
      clearTimeout(timer);
      tick();
    }

    function stop() {
      running = false;
      toggleBtn.textContent = "Start";
      clearTimeout(timer);
    }

    function updateLabel() {
      rateLabel.textContent = `${Number(rateInput.value).toFixed(1)} / sec`;
    }

    rateInput.addEventListener("input", () => {
      updateLabel();
      if (running) {
        clearTimeout(timer);
        timer = setTimeout(tick, 1000 / Number(rateInput.value));
      }
    });

    toggleBtn.addEventListener("click", () => (running ? stop() : start()));

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" && e.target.tagName !== "SELECT") {
        e.preventDefault();
        running ? stop() : start();
      }
    });

    updateLabel();
    start();
  </script>
</body>
</html>
