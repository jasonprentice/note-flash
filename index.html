<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Note Flash</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      background: #111;
      color: #f5f5f5;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
    }

    .display {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: baseline;
      gap: 0.3em;
      width: 100%;
      font-size: min(27vw, 48vh);
      font-weight: 700;
      line-height: 1;
      font-family: Georgia, "Times New Roman", serif;
    }

    #string {
      font-family: "Times New Roman", Times, serif;
      font-variant-numeric: lining-nums tabular-nums;
      justify-self: end;
    }

    #note {
      min-height: 1em;
      white-space: nowrap;
    }

    #note .accidental {
      font-size: 0.6em;
      vertical-align: 0.5em;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      width: min(90vw, 480px);
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      width: 100%;
    }

    input[type="range"] {
      flex: 1;
      accent-color: #4fa3ff;
    }

    #rate-label {
      font-variant-numeric: tabular-nums;
      min-width: 7.5em;
      text-align: right;
    }

    button {
      font-size: 1rem;
      padding: 0.6rem 2rem;
      border: none;
      border-radius: 999px;
      background: #4fa3ff;
      color: #111;
      font-weight: 600;
      cursor: pointer;
    }

    .switch {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
    }

    .switch input {
      appearance: none;
      width: 2.6rem;
      height: 1.5rem;
      margin: 0;
      border-radius: 999px;
      background: #444;
      position: relative;
      cursor: pointer;
      transition: background 0.15s;
    }

    .switch input::after {
      content: "";
      position: absolute;
      top: 0.2rem;
      left: 0.2rem;
      width: 1.1rem;
      height: 1.1rem;
      border-radius: 50%;
      background: #f5f5f5;
      transition: transform 0.15s;
    }

    .switch input:checked {
      background: #4fa3ff;
    }

    .switch input:checked::after {
      transform: translateX(1.1rem);
    }

    .hint {
      color: #777;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="display">
    <div id="string">1</div>
    <div id="note">C</div>
  </div>

  <div class="controls">
    <div class="slider-row">
      <span>Slow</span>
      <input id="rate" type="range" min="0.2" max="3" step="0.1" value="1" />
      <span>Fast</span>
      <span id="rate-label"></span>
    </div>
    <label class="switch">
      <input id="accidentals" type="checkbox" checked />
      <span>Include sharps / flats</span>
    </label>
    <button id="toggle">Pause</button>
    <div class="hint">Press Space to pause / resume</div>
  </div>

  <script>
    const NOTES = [
      "C", "C#", "Db", "D", "D#", "Eb", "E", "F", "F#",
      "Gb", "G", "G#", "Ab", "A", "A#", "Bb", "B",
    ];

    const noteEl = document.getElementById("note");
    const stringEl = document.getElementById("string");
    const rateInput = document.getElementById("rate");
    const rateLabel = document.getElementById("rate-label");
    const toggleBtn = document.getElementById("toggle");
    const accidentalsInput = document.getElementById("accidentals");

    let current = null;
    let timer = null;
    let running = true;

    function render(note) {
      const letter = note[0];
      const accidental = note[1] === "#" ? "♯" : note[1] === "b" ? "♭" : "";
      noteEl.innerHTML = accidental
        ? `${letter}<span class="accidental">${accidental}</span>`
        : letter;
    }

    function nextNote() {
      const pool = accidentalsInput.checked
        ? NOTES
        : NOTES.filter((n) => n.length === 1);
      let note;
      do {
        note = pool[Math.floor(Math.random() * pool.length)];
      } while (note === current);
      current = note;
      render(note);
      stringEl.textContent = 1 + Math.floor(Math.random() * 6);
    }

    function tick() {
      nextNote();
      timer = setTimeout(tick, 1000 / Number(rateInput.value));
    }

    function start() {
      running = true;
      toggleBtn.textContent = "Pause";
      clearTimeout(timer);
      tick();
    }

    function stop() {
      running = false;
      toggleBtn.textContent = "Start";
      clearTimeout(timer);
    }

    function updateLabel() {
      rateLabel.textContent = `${Number(rateInput.value).toFixed(1)} / sec`;
    }

    rateInput.addEventListener("input", () => {
      updateLabel();
      if (running) {
        clearTimeout(timer);
        timer = setTimeout(tick, 1000 / Number(rateInput.value));
      }
    });

    toggleBtn.addEventListener("click", () => (running ? stop() : start()));

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        running ? stop() : start();
      }
    });

    updateLabel();
    start();
  </script>
</body>
</html>
